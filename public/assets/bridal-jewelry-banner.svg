<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDA1C9" />
      <stop offset="35%" stop-color="#D4B2F5" />
      <stop offset="65%" stop-color="#9C8EE8" />
      <stop offset="100%" stop-color="#7B69D4" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#A5EDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#BBE3FD" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#BBE3FD" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pinkGlow" cx="10%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#FF9EC8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#EAA6D5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EAA6D5" stop-opacity="0" />
    </radialGradient>

    <!-- Diamond Ring Metal Shading -->
    <linearGradient id="platinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="diamondFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="85%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Sapphire Gradients -->
    <radialGradient id="sapphireGem" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4F8CFF" />
      <stop offset="25%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Sparkle Stars Filter & Markers -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3B2667" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="800" fill="url(#bgGrad)" />
  <rect width="1600" height="800" fill="url(#cyanGlow)" />
  <rect width="1600" height="800" fill="url(#pinkGlow)" />

  <!-- Dreamy Bubbles / Spheres -->
  <!-- Top Left Bubble -->
  <g opacity="0.65" filter="url(#glow)">
    <circle cx="160" cy="180" r="140" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4" />
    <circle cx="160" cy="180" r="140" fill="#FFC8DD" opacity="0.25" />
    <path d="M 80,130 Q 140,80 200,100" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <circle cx="230" cy="130" r="12" fill="#FFFFFF" opacity="0.5" />
  </g>

  <!-- Bottom Right Bubble -->
  <g opacity="0.5" filter="url(#glow)">
    <circle cx="1500" cy="720" r="180" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.35" />
    <circle cx="1500" cy="720" r="180" fill="#A5EDF8" opacity="0.2" />
    <path d="M 1390,620 Q 1470,590 1560,630" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Constellation sparkle lines -->
  <g stroke="#FFFFFF" stroke-width="0.75" opacity="0.25">
    <line x1="100" y1="200" x2="350" y2="280" />
    <line x1="350" y1="280" x2="520" y2="160" />
    <line x1="520" y1="160" x2="720" y2="300" />
    <line x1="720" y1="300" x2="900" y2="180" />
    <line x1="900" y1="180" x2="1150" y2="240" />
    <line x1="1150" y1="240" x2="1350" y2="160" />
    <line x1="1350" y1="160" x2="1520" y2="320" />
    <line x1="200" y1="650" x2="380" y2="520" />
    <line x1="380" y1="520" x2="560" y2="680" />
    <line x1="850" y1="680" x2="1080" y2="740" />
    <line x1="1080" y1="740" x2="1280" y2="600" />
    <line x1="1280" y1="600" x2="1480" y2="680" />
  </g>

  <!-- Sparkle Stars Generator Function Replacements -->
  <!-- Star macro 1 (Top Left) -->
  <g transform="translate(520, 160)" filter="url(#glow)">
    <path d="M 0,-45 Q 0,0 45,0 Q 0,0 0,45 Q 0,0 -45,0 Q 0,0 0,-45 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>

  <!-- Star macro 2 (Center High) -->
  <g transform="translate(900, 180)" filter="url(#glow)">
    <path d="M 0,-55 Q 0,0 55,0 Q 0,0 0,55 Q 0,0 -55,0 Q 0,0 0,-55 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="9" fill="#FFFFFF" />
  </g>

  <!-- Star macro 3 (Beside Ring) -->
  <g transform="translate(740, 420)" filter="url(#glow)">
    <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#FFFFFF" />
  </g>

  <!-- Star macro 4 (Above Ring Solitaire) -->
  <g transform="translate(920, 145)" filter="url(#glow)">
    <path d="M 0,-70 Q 0,0 70,0 Q 0,0 0,70 Q 0,0 -70,0 Q 0,0 0,-70 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="28" fill="#FFF0F8" opacity="0.6" />
  </g>

  <!-- Star macro 5 (Near Earrings) -->
  <g transform="translate(1360, 390)" filter="url(#glow)">
    <path d="M 0,-60 Q 0,0 60,0 Q 0,0 0,60 Q 0,0 -60,0 Q 0,0 0,-60 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" />
  </g>

  <!-- Star macro 6 (Lower Right) -->
  <g transform="translate(1100, 730)" filter="url(#glow)">
    <path d="M 0,-40 Q 0,0 40,0 Q 0,0 0,40 Q 0,0 -40,0 Q 0,0 0,-40 Z" fill="#FFFFFF" />
  </g>

  <!-- Star macro 7 (Far Right Top) -->
  <g transform="translate(1480, 160)" filter="url(#glow)">
    <path d="M 0,-48 Q 0,0 48,0 Q 0,0 0,48 Q 0,0 -48,0 Q 0,0 0,-48 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>

  <!-- Star macro 8 (Left Side Accent) -->
  <g transform="translate(220, 680)" filter="url(#glow)">
    <path d="M 0,-50 Q 0,0 50,0 Q 0,0 0,50 Q 0,0 -50,0 Q 0,0 0,-50 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>

  <g transform="translate(340, 270)" filter="url(#glow)">
    <path d="M 0,-32 Q 0,0 32,0 Q 0,0 0,32 Q 0,0 -32,0 Q 0,0 0,-32 Z" fill="#FFFFFF" />
  </g>

  <!-- Tiny twinkle stars -->
  <circle cx="420" cy="450" r="2.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="630" cy="220" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="1020" cy="70" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="1200" cy="110" r="2.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="1280" cy="300" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="1560" cy="480" r="3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="80" cy="500" r="3" fill="#FFFFFF" opacity="0.8" />


  <!-- ============================================== -->
  <!-- JEWELRY 1: MAGNIFICENT PAVE DOME DIAMOND RING -->
  <!-- ============================================== -->
  <g transform="translate(860, 360) rotate(-14)" filter="url(#softShadow)">
    <!-- Ring Shank Inner Hollow / Finger opening -->
    <ellipse cx="60" cy="120" rx="95" ry="140" fill="#2A1B4E" opacity="0.4" />
    
    <!-- Heavy Solid Platinum Band Base -->
    <path d="M -70,70 Q 60,280 190,70 L 175,20 Q 60,220 -55,20 Z" fill="url(#platinum)" stroke="#FFFFFF" stroke-width="1.5" />
    
    <!-- Wide Pavé Diamond Dome Setting -->
    <path d="M -90,40 C -130,-40 -110,-150 -40,-200 C 40,-240 140,-230 190,-160 C 230,-90 220,10 180,50 C 130,-30 80,-70 -30,-60 C -65,-30 -80,10 -90,40 Z" fill="url(#platinum)" stroke="#E2E8F0" stroke-width="2" />

    <!-- Pavé Diamond Micro-Clusters (Grid of sparkling round diamonds) -->
    <!-- Layer 1 -->
    <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2">
      <circle cx="-60" cy="-15" r="9" />
      <circle cx="-38" cy="-22" r="9" />
      <circle cx="-15" cy="-26" r="9" />
      <circle cx="10" cy="-28" r="9" />
      <circle cx="35" cy="-26" r="9" />
      <circle cx="60" cy="-22" r="9" />
      <circle cx="82" cy="-15" r="9" />
      <circle cx="104" cy="-5" r="9" />
      <circle cx="125" cy="8" r="9" />
      <circle cx="145" cy="24" r="9" />
    </g>

    <!-- Layer 2 -->
    <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2">
      <circle cx="-75" cy="-45" r="9.5" />
      <circle cx="-52" cy="-52" r="9.5" />
      <circle cx="-28" cy="-56" r="9.5" />
      <circle cx="-2" cy="-58" r="9.5" />
      <circle cx="24" cy="-58" r="9.5" />
      <circle cx="50" cy="-55" r="9.5" />
      <circle cx="75" cy="-48" r="9.5" />
      <circle cx="98" cy="-38" r="9.5" />
      <circle cx="120" cy="-25" r="9.5" />
      <circle cx="140" cy="-8" r="9.5" />
      <circle cx="158" cy="12" r="9.5" />
    </g>

    <!-- Layer 3 -->
    <g fill="#FFFFFF" stroke="#64748B" stroke-width="1.2">
      <circle cx="-85" cy="-78" r="10" />
      <circle cx="-62" cy="-85" r="10" />
      <circle cx="-38" cy="-90" r="10" />
      <circle cx="-12" cy="-92" r="10" />
      <circle cx="14" cy="-92" r="10" />
      <circle cx="40" cy="-90" r="10" />
      <circle cx="66" cy="-84" r="10" />
      <circle cx="90" cy="-75" r="10" />
      <circle cx="114" cy="-62" r="10" />
      <circle cx="136" cy="-46" r="10" />
      <circle cx="154" cy="-28" r="10" />
    </g>

    <!-- Layer 4 -->
    <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2">
      <circle cx="-88" cy="-112" r="10.5" />
      <circle cx="-64" cy="-120" r="10.5" />
      <circle cx="-38" cy="-125" r="10.5" />
      <circle cx="-10" cy="-128" r="10.5" />
      <circle cx="18" cy="-128" r="10.5" />
      <circle cx="46" cy="-125" r="10.5" />
      <circle cx="72" cy="-118" r="10.5" />
      <circle cx="98" cy="-108" r="10.5" />
      <circle cx="122" cy="-94" r="10.5" />
      <circle cx="144" cy="-76" r="10.5" />
    </g>

    <!-- Layer 5 (Upper Dome) -->
    <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2">
      <circle cx="-75" cy="-148" r="11" />
      <circle cx="-50" cy="-156" r="11" />
      <circle cx="-22" cy="-162" r="11" />
      <circle cx="6" cy="-164" r="11" />
      <circle cx="34" cy="-162" r="11" />
      <circle cx="62" cy="-156" r="11" />
      <circle cx="88" cy="-146" r="11" />
      <circle cx="112" cy="-132" r="11" />
    </g>

    <!-- Inner diamond facets reflection spots -->
    <g fill="#38BDF8" opacity="0.6">
      <circle cx="-52" cy="-52" r="3.5" />
      <circle cx="24" cy="-58" r="3.5" />
      <circle cx="90" cy="-75" r="3.5" />
      <circle cx="-10" cy="-128" r="3.5" />
      <circle cx="62" cy="-156" r="3.5" />
    </g>
    <g fill="#F472B6" opacity="0.5">
      <circle cx="-28" cy="-56" r="3.5" />
      <circle cx="50" cy="-55" r="3.5" />
      <circle cx="14" cy="-92" r="3.5" />
      <circle cx="-38" cy="-125" r="3.5" />
      <circle cx="88" cy="-146" r="3.5" />
    </g>

    <!-- Crown Setting / Prongs for Solitaire -->
    <g stroke="#E2E8F0" stroke-width="2.5" fill="url(#platinum)">
      <!-- Left Prongs -->
      <path d="M -60,-170 L -45,-250 L -30,-240 L -45,-175 Z" />
      <path d="M -15,-180 L 0,-268 L 15,-268 L 5,-180 Z" />
      <path d="M 40,-175 L 55,-255 L 70,-245 L 50,-170 Z" />
    </g>

    <!-- Center Solitaire Brilliant Cut Diamond (Large 5-Carat Crown) -->
    <g transform="translate(10, -260)">
      <!-- Diamond Outer Silhouette -->
      <polygon points="-80,-20 -50,-80 50,-80 80,-20 60,40 0,80 -60,40" fill="url(#diamondFacet)" stroke="#FFFFFF" stroke-width="3" />
      
      <!-- Table Facet (Top Flat Face) -->
      <polygon points="-40,-75 40,-75 55,-40 0,-30 -55,-40" fill="#FFFFFF" opacity="0.95" stroke="#E2E8F0" stroke-width="1.5" />
      
      <!-- Star Facets & Kite Facets -->
      <polygon points="-40,-75 -50,-80 -80,-20 -55,-40" fill="#E0F2FE" opacity="0.85" stroke="#CBD5E1" stroke-width="1.2" />
      <polygon points="40,-75 50,-80 80,-20 55,-40" fill="#F1F5F9" opacity="0.9" stroke="#CBD5E1" stroke-width="1.2" />
      <polygon points="0,-30 -55,-40 -60,40 0,60" fill="#BAE6FD" opacity="0.8" stroke="#CBD5E1" stroke-width="1.2" />
      <polygon points="0,-30 55,-40 60,40 0,60" fill="#FFFFFF" opacity="0.9" stroke="#CBD5E1" stroke-width="1.2" />
      <polygon points="0,60 -60,40 0,80" fill="#E0E7FF" opacity="0.85" stroke="#94A3B8" stroke-width="1.2" />
      <polygon points="0,60 60,40 0,80" fill="#C7D2FE" opacity="0.85" stroke="#94A3B8" stroke-width="1.2" />

      <!-- Center Intense Radiance Flare -->
      <circle cx="0" cy="-45" r="14" fill="#FFFFFF" opacity="0.95" />
      <path d="M 0,-85 L 0,-5 M -40,-45 L 40,-45" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>


  <!-- ============================================== -->
  <!-- JEWELRY 2: ROYAL SAPPHIRE & DIAMOND EARRINGS   -->
  <!-- ============================================== -->
  <!-- Earring 1 (Left Drop) -->
  <g transform="translate(1180, 360)" filter="url(#softShadow)">
    <!-- Diamond Hoop / Huggie Leverback -->
    <path d="M 0,-40 C -35,-40 -45,70 0,110 C 25,90 35,40 20,-20 C 15,-35 8,-40 0,-40 Z" fill="none" stroke="url(#platinum)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Micro Diamonds along the hoop -->
    <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="1">
      <circle cx="-12" cy="-28" r="4.5" />
      <circle cx="-22" cy="-10" r="4.5" />
      <circle cx="-28" cy="12" r="4.5" />
      <circle cx="-28" cy="36" r="4.5" />
      <circle cx="-20" cy="58" r="4.5" />
      <circle cx="-8" cy="78" r="4.5" />
      <circle cx="6" cy="94" r="4.5" />
    </g>

    <!-- Connector Joint / Bail -->
    <rect x="-4" y="112" width="8" height="14" rx="2" fill="url(#platinum)" />

    <!-- Circular Sapphire Pendant with Diamond Halo -->
    <g transform="translate(0, 185)">
      <!-- Halo Outer Setting Metal -->
      <circle cx="0" cy="0" r="62" fill="url(#platinum)" stroke="#CBD5E1" stroke-width="2" />
      
      <!-- Halo Diamonds (Ring of 16 diamonds) -->
      <g fill="#FFFFFF" stroke="#64748B" stroke-width="1.2">
        <circle cx="0" cy="-48" r="7.5" />
        <circle cx="18" cy="-44" r="7.5" />
        <circle cx="34" cy="-34" r="7.5" />
        <circle cx="44" cy="-18" r="7.5" />
        <circle cx="48" cy="0" r="7.5" />
        <circle cx="44" cy="18" r="7.5" />
        <circle cx="34" cy="34" r="7.5" />
        <circle cx="18" cy="44" r="7.5" />
        <circle cx="0" cy="48" r="7.5" />
        <circle cx="-18" cy="44" r="7.5" />
        <circle cx="-34" cy="34" r="7.5" />
        <circle cx="-44" cy="18" r="7.5" />
        <circle cx="-48" cy="0" r="7.5" />
        <circle cx="-44" cy="-18" r="7.5" />
        <circle cx="-34" cy="-34" r="7.5" />
        <circle cx="-18" cy="-44" r="7.5" />
      </g>

      <!-- Inner Royal Blue Sapphire Cushion Gemstone -->
      <circle cx="0" cy="0" r="35" fill="url(#sapphireGem)" stroke="#1E3A8A" stroke-width="2" />
      
      <!-- Sapphire Facet Reflections -->
      <polygon points="-24,-12 0,-30 24,-12 18,20 -18,20" fill="#3B82F6" opacity="0.4" stroke="#60A5FA" stroke-width="1" />
      <polygon points="-12,-8 0,-20 12,-8 8,12 -8,12" fill="#93C5FD" opacity="0.6" />
      <circle cx="-10" cy="-12" r="5" fill="#FFFFFF" opacity="0.8" />
      <circle cx="14" cy="10" r="3.5" fill="#93C5FD" opacity="0.6" />
    </g>
  </g>

  <!-- Earring 2 (Right Drop) -->
  <g transform="translate(1330, 420)" filter="url(#softShadow)">
    <!-- Diamond Hoop / Huggie Leverback -->
    <path d="M 0,-40 C -35,-40 -45,70 0,110 C 25,90 35,40 20,-20 C 15,-35 8,-40 0,-40 Z" fill="none" stroke="url(#platinum)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Micro Diamonds along the hoop -->
    <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="1">
      <circle cx="-12" cy="-28" r="4.5" />
      <circle cx="-22" cy="-10" r="4.5" />
      <circle cx="-28" cy="12" r="4.5" />
      <circle cx="-28" cy="36" r="4.5" />
      <circle cx="-20" cy="58" r="4.5" />
      <circle cx="-8" cy="78" r="4.5" />
      <circle cx="6" cy="94" r="4.5" />
    </g>

    <!-- Connector Joint / Bail -->
    <rect x="-4" y="112" width="8" height="14" rx="2" fill="url(#platinum)" />

    <!-- Circular Sapphire Pendant with Diamond Halo -->
    <g transform="translate(0, 185)">
      <!-- Halo Outer Setting Metal -->
      <circle cx="0" cy="0" r="62" fill="url(#platinum)" stroke="#CBD5E1" stroke-width="2" />
      
      <!-- Halo Diamonds (Ring of 16 diamonds) -->
      <g fill="#FFFFFF" stroke="#64748B" stroke-width="1.2">
        <circle cx="0" cy="-48" r="7.5" />
        <circle cx="18" cy="-44" r="7.5" />
        <circle cx="34" cy="-34" r="7.5" />
        <circle cx="44" cy="-18" r="7.5" />
        <circle cx="48" cy="0" r="7.5" />
        <circle cx="44" cy="18" r="7.5" />
        <circle cx="34" cy="34" r="7.5" />
        <circle cx="18" cy="44" r="7.5" />
        <circle cx="0" cy="48" r="7.5" />
        <circle cx="-18" cy="44" r="7.5" />
        <circle cx="-34" cy="34" r="7.5" />
        <circle cx="-44" cy="18" r="7.5" />
        <circle cx="-48" cy="0" r="7.5" />
        <circle cx="-44" cy="-18" r="7.5" />
        <circle cx="-34" cy="-34" r="7.5" />
        <circle cx="-18" cy="-44" r="7.5" />
      </g>

      <!-- Inner Royal Blue Sapphire Cushion Gemstone -->
      <circle cx="0" cy="0" r="35" fill="url(#sapphireGem)" stroke="#1E3A8A" stroke-width="2" />
      
      <!-- Sapphire Facet Reflections -->
      <polygon points="-24,-12 0,-30 24,-12 18,20 -18,20" fill="#3B82F6" opacity="0.4" stroke="#60A5FA" stroke-width="1" />
      <polygon points="-12,-8 0,-20 12,-8 8,12 -8,12" fill="#93C5FD" opacity="0.6" />
      <circle cx="-10" cy="-12" r="5" fill="#FFFFFF" opacity="0.8" />
      <circle cx="14" cy="10" r="3.5" fill="#93C5FD" opacity="0.6" />
    </g>
  </g>
</svg>
